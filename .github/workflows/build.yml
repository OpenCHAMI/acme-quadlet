name: build
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      rpm-unsigned: ${{ steps.names.outputs.rpm-unsigned }}
      rpm-signed:   ${{ steps.names.outputs.rpm-signed }}
      keys-public:  ${{ steps.names.outputs.keys-public }}
    steps:
      - id: names
        run: |
          {
            echo "rpm-unsigned=rpms-unsigned"
            echo "rpm-signed=rpms-signed"
            echo "keys-public=gpg-public-keys"
          } >> "$GITHUB_OUTPUT"

  rpmbuild:
    needs: [config]
    uses: OpenCHAMI/github-actions/.github/workflows/build-rpm-quadlet.yml@v3.9
    secrets: inherit
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}

  rpmsign:
    needs: [config, rpmbuild]
    uses: OpenCHAMI/github-actions/.github/workflows/gpg-sign-artifacts.yml@v3.9
    secrets: inherit
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}
      artifact-name-signed-rpms:   ${{ needs.config.outputs.rpm-signed }}
      artifact-name-public-keys:   ${{ needs.config.outputs.keys-public }}

  rpmvalidate:
    needs: [config, rpmsign]
    uses: OpenCHAMI/github-actions/.github/workflows/validate-rpm-quadlet.yml@v3.9
    secrets: inherit
    with:
      artifact-name-signed-rpms:   ${{ needs.config.outputs.rpm-signed }}
      rpms: |
        - name: openchami-acme-quadlet-*.rpm
          files:
            - /usr/lib/systemd/system/openchami-cert-renewal.service
            - /usr/lib/systemd/system/openchami-cert-renewal.timer
            - /usr/lib/systemd/system/openchami-cert-trust.service
            - /usr/share/containers/systemd/acme-.container.d
            - /usr/share/containers/systemd/acme-.container.d/10-defaults-shared.conf
            - /usr/share/containers/systemd/acme-certs.volume
            - /usr/share/containers/systemd/acme-deploy.container
            - /usr/share/containers/systemd/acme-deploy.container.d
            - /usr/share/containers/systemd/acme-deploy.container.d/10-defaults-service.conf
            - /usr/share/containers/systemd/acme-register.container
            - /usr/share/licenses/openchami-acme-quadlet
            - /usr/share/licenses/openchami-acme-quadlet/MIT.txt
